name: Publish GitHub Pages

# This repository's Pages site is served from the root of main, and GitHub
# Pages does not compile the Vite app. Rebuild the static files whenever
# source changes land on main so the live site cannot go blank again.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/**'
      - 'images/**'
      - 'index.html'
      - '404.html'
      - '.nojekyll'
      - 'favicon.svg'
      - 'robots.txt'
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Commit published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets images index.html 404.html .nojekyll favicon.svg robots.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "Published files already match this build."
          else
            git commit -m "Publish static site for GitHub Pages"
            git push
          fi
